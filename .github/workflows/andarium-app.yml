name: Andarium app-only build

on:
  push:
    branches:
      - andarium-bugfixes
    paths:
      - Andarium/Andarium/**
      - Andarium/Andarium.xcodeproj/**
      - Andarium/Assets.xcassets/**
      - Andarium/Info.plist
      - Andarium/PrivacyInfo.xcprivacy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: andarium-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned Andarium using verified foundation
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - name: Check out app source
        uses: actions/checkout@v4
        with:
          ref: andarium-bugfixes
          fetch-depth: 0

      - name: Verify Xcode toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          echo "xcode=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"
          test "$(uname -m)" = arm64
          python3 --version

      # This exact key is shared with the foundation workflow. A miss is a
      # hard stop: app builds must never silently rebuild Android or runtimes.
      - name: Restore verified foundation bundle
        id: foundation
        uses: actions/cache@v4
        with:
          path: |
            .build/dependencies
            .build/kernel/artifacts
            .build/android/releases
            .build/android/aot
            .build/kernarium-runtime-ios-device-android-4k
            .build/kernarium-xcframeworks
            .build/andarium-system
          key: andarium-foundation-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'Kernarium/**', 'dependencies/**', 'kernel/**', 'android/lineage-24/**', 'scripts/check-embedded-artifacts.py', 'Andarium/scripts/stage-system-image.py') }}

      - name: Stop if the foundation bundle is missing
        if: steps.foundation.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "::error::No matching verified foundation bundle exists for this source and Xcode toolchain. Run the Andarium foundation workflow first."
          exit 1

      - name: Verify restored foundation artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -d .build/dependencies
          test -d .build/kernel/artifacts
          test -d .build/android/releases/lineage24-mainline6.18-4k-20261121-los24-r29
          test -d .build/android/aot
          test -d .build/kernarium-runtime-ios-device-android-4k
          test -d .build/kernarium-xcframeworks
          test -d .build/andarium-system
          python3 scripts/check-embedded-artifacts.py --android-release --kernel android --aot

      - name: Build Andarium Release app without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project Andarium/Andarium.xcodeproj \
            -scheme Andarium \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/.build/AndariumDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP="$PWD/.build/AndariumDerivedData/Build/Products/Release-iphoneos/Andarium.app"
          test -d "$APP"
          python3 scripts/check-embedded-artifacts.py \
            --android-release --kernel android --aot --app "$APP"
          mkdir -p .build/ipa/Payload
          ditto "$APP" .build/ipa/Payload/Andarium.app
          (cd .build/ipa && ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/Andarium-baseline-unsigned.ipa")
          shasum -a 256 Andarium-baseline-unsigned.ipa
          du -sh Andarium-baseline-unsigned.ipa

      - name: Upload unsigned IPA and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: andarium-app-only-${{ github.run_number }}
          path: |
            Andarium-baseline-unsigned.ipa
            .build/AndariumDerivedData/Logs/Build/**
          if-no-files-found: warn
          retention-days: 14
