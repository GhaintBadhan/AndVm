name: Andarium app-only build

on:
  push:
    branches:
      - andarium-bugfixes
    paths:
      - Andarium/Andarium/**
      - Andarium/Andarium.xcodeproj/**
      - Andarium/Assets.xcassets/**
      - Andarium/Info.plist
      - Andarium/PrivacyInfo.xcprivacy
      - .github/workflows/andarium-app.yml
  workflow_dispatch:

# Branch-only trigger: keep main untouched; a workflow-file commit queues this build.

permissions:
  contents: read

concurrency:
  group: andarium-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned Andarium using verified foundation
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - name: Check out app source
        uses: actions/checkout@v4
        with:
          ref: andarium-bugfixes
          fetch-depth: 0

      - name: Verify Xcode toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          echo "xcode=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"
          echo "xcode_hash=$(xcodebuild -version | shasum -a 256 | cut -c1-12)" >> "$GITHUB_OUTPUT"
          test "$(uname -m)" = arm64
          python3 --version

      # Download the immutable, versioned foundation from this repository's
      # Releases. This works on a completely fresh hosted runner; no cache hit
      # or previous runner disk is required.
      - name: Download and verify foundation release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FOUNDATION_SOURCE_HASH: ${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'Kernarium/**', 'dependencies/**', 'kernel/**', 'android/lineage-24/**', 'scripts/check-embedded-artifacts.py', 'Andarium/scripts/stage-system-image.py') }}
          XCODE_HASH: ${{ steps.toolchain.outputs.xcode_hash }}
        run: |
          set -euo pipefail
          TAG="andarium-foundation-${XCODE_HASH}-${FOUNDATION_SOURCE_HASH}"
          mkdir -p .build/foundation-download
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir .build/foundation-download
          cd .build/foundation-download
          test -f manifest.json
          test -f SHA256SUMS
          test -f archive.sha256
          python3 - "$TAG" "$FOUNDATION_SOURCE_HASH" "$XCODE_HASH" <<'PY'
          import json, sys
          with open("manifest.json", encoding="utf-8") as f:
              manifest = json.load(f)
          expected = {"tag": sys.argv[1], "source_hash": sys.argv[2], "xcode_hash": sys.argv[3]}
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f"Foundation manifest mismatch for {key}")
          print("Foundation manifest matches source and Xcode fingerprints")
          PY
          shasum -a 256 -c SHA256SUMS
          cat andarium-foundation.tar.gz.part-* > andarium-foundation.tar.gz
          shasum -a 256 -c archive.sha256
          tar -xzf andarium-foundation.tar.gz -C "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"

      - name: Verify restored foundation artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -d .build/dependencies
          test -d .build/kernel/artifacts
          test -d .build/android/releases/lineage24-mainline6.18-4k-20261121-los24-r29
          test -d .build/android/aot
          test -d .build/kernarium-runtime-ios-device-android-4k
          test -d .build/kernarium-xcframeworks
          test -d .build/andarium-system
          python3 scripts/check-embedded-artifacts.py --android-release --kernel android --aot

      - name: Build Andarium Release app without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project Andarium/Andarium.xcodeproj \
            -scheme Andarium \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/.build/AndariumDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP="$PWD/.build/AndariumDerivedData/Build/Products/Release-iphoneos/Andarium.app"
          test -d "$APP"
          python3 scripts/check-embedded-artifacts.py \
            --android-release --kernel android --aot --app "$APP"
          mkdir -p .build/ipa/Payload
          ditto "$APP" .build/ipa/Payload/Andarium.app
          (cd .build/ipa && ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/Andarium-baseline-unsigned.ipa")
          shasum -a 256 Andarium-baseline-unsigned.ipa
          du -sh Andarium-baseline-unsigned.ipa

      - name: Upload unsigned IPA and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: andarium-app-only-${{ github.run_number }}
          path: |
            Andarium-baseline-unsigned.ipa
            .build/AndariumDerivedData/Logs/Build/**
          if-no-files-found: warn
          retention-days: 14
