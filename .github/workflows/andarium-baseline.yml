name: Andarium foundation build

on:
  push:
    branches:
      - andarium-bugfixes
    paths:
      - .github/workflows/andarium-baseline.yml
      - Kernarium/**
      - dependencies/**
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/**
      - kernel/**
      - scripts/check-embedded-artifacts.py
      - Andarium/scripts/stage-system-image.py
      - android/lineage-24/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: andarium-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish verified Andarium foundation
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - name: Check out untouched baseline
        uses: actions/checkout@v4
        with:
          ref: andarium-bugfixes
          fetch-depth: 0

      - name: Verify toolchain and configure build identity
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          echo "xcode=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"
          echo "xcode_hash=$(xcodebuild -version | shasum -a 256 | cut -c1-12)" >> "$GITHUB_OUTPUT"
          test "$(uname -m)" = arm64
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 --version
          df -h /

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake ninja gettext autoconf automake libtool gperf pkg-config groff xz
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix xz)/bin" >> "$GITHUB_PATH"
          xz --version
          mkdir -p .build
          python3 -m venv .build/tools-venv
          .build/tools-venv/bin/pip install --upgrade pip
          .build/tools-venv/bin/pip install meson mako pyyaml
          echo "$GITHUB_WORKSPACE/.build/tools-venv/bin" >> "$GITHUB_PATH"

      # One immutable cache holds every verified foundation output needed by
      # an app-only build. Its fingerprint covers all producers, accepted
      # Android descriptors, and the exact Xcode toolchain.
      - name: Restore or publish verified foundation bundle
        uses: actions/cache@v4
        with:
          path: |
            .build/dependencies
            .build/kernel/artifacts
            .build/android/releases
            .build/android/aot
            .build/kernarium-runtime-ios-device-android-4k
            .build/kernarium-xcframeworks
            .build/andarium-system
          key: andarium-foundation-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'Kernarium/**', 'dependencies/**', 'kernel/**', 'android/lineage-24/**', 'scripts/check-embedded-artifacts.py', 'Andarium/scripts/stage-system-image.py') }}

      - name: Install Apple Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Prepare pinned dependency sources
        shell: bash
        run: |
          set -euo pipefail
          dependencies/prepare.sh --product apple-gpu-vulkan-experiment
          dependencies/prepare.sh --product ios-network
          dependencies/prepare.sh --product ios-storage
          dependencies/prepare.sh --product ios-compression

      - name: Build verified iOS dependency prefixes
        shell: bash
        env:
          UML_APPLE_GPU_DEPENDENCY_JOBS: "2"
          UML_IOS_NETWORK_DEPENDENCY_JOBS: "2"
          UML_IOS_STORAGE_DEPENDENCY_JOBS: "2"
          UML_IOS_ZSTD_DEPENDENCY_JOBS: "2"
        run: |
          set -euo pipefail
          source .build/tools-venv/bin/activate
          python -m pip install packaging
          python -c "import mako, packaging, yaml; print('Python build modules verified')"
          dependencies/build-apple-gpu.sh --platform ios
          dependencies/build-ios-network.sh --platform ios
          dependencies/build-ios-storage.sh
          dependencies/build-ios-zstd.sh

      - name: Fetch accepted Android kernel and LineageOS release when missing
        shell: bash
        run: |
          set -euo pipefail
          KERNEL_DIR=".build/kernel/artifacts/android-6.18-arm64-4k-20261119-6.18.60-ca1"
          RELEASE_DIR=".build/android/releases/lineage24-mainline6.18-4k-20261121-los24-r29"
          if [ -f "$KERNEL_DIR/kernel-artifact.json" ] && [ -f "$RELEASE_DIR/release-manifest.json" ] && [ -d .build/android/aot ]; then
            echo "Reusing restored accepted kernel, Android 17 release and AOT foundation"
            exit 0
          fi

          mkdir -p .build/kernel/artifacts .build/baseline-inputs
          curl --fail --location --retry 3 \
            "https://github.com/imxieyi/Kernarium/releases/download/andarium-1.1/android-6.18-arm64-4k-20261119-6.18.60-ca1.tar.gz" \
            -o .build/baseline-inputs/android-kernel.tar.gz
          echo "128d0948d6989e7d1cd03edc5f1c1218d0dd2fac99c7bb960897c64019e38196  .build/baseline-inputs/android-kernel.tar.gz" | shasum -a 256 -c -
          tar -xzf .build/baseline-inputs/android-kernel.tar.gz -C .build/kernel/artifacts
          test -f "$KERNEL_DIR/kernel-artifact.json"

          curl --fail --location --retry 3 \
            "https://github.com/imxieyi/Kernarium/releases/download/andarium-1.1/lineage24-mainline6.18-4k-20261121-los24-r29.tar.gz" \
            -o .build/baseline-inputs/android-release.tar.gz
          echo "0d9628d61c9aee094fb433b3a02138fe3071ca7eddc14b93834236188106a460  .build/baseline-inputs/android-release.tar.gz" | shasum -a 256 -c -
          mkdir -p .build/baseline-inputs/android-release
          tar -xzf .build/baseline-inputs/android-release.tar.gz -C .build/baseline-inputs/android-release
          RELEASE_MANIFEST="$(find .build/baseline-inputs/android-release -type f -name release-manifest.json -print -quit)"
          test -n "$RELEASE_MANIFEST"
          RELEASE_SOURCE="$(cd "$(dirname "$RELEASE_MANIFEST")" && pwd)"

          curl --fail --location --retry 3 \
            "https://github.com/imxieyi/Kernarium/releases/download/andarium-1.1/lineage24-mainline6.18-4k-20261121-los24-r29-aot.tar.gz" \
            -o .build/baseline-inputs/android-aot.tar.gz
          echo "bdba3b58c8c7b4ab72a357beb14b21281b9204411ec19d43de3f7bb9b6005175  .build/baseline-inputs/android-aot.tar.gz" | shasum -a 256 -c -
          mkdir -p .build/baseline-inputs/android-aot
          tar -xzf .build/baseline-inputs/android-aot.tar.gz -C .build/baseline-inputs/android-aot
          AOT_MANIFEST="$(find .build/baseline-inputs/android-aot -type f -name artifact.json -print -quit)"
          test -n "$AOT_MANIFEST"
          AOT_SOURCE="$(cd "$(dirname "$AOT_MANIFEST")" && pwd)"

          rm -rf .build/android/releases/lineage24-mainline6.18-4k-20261121-los24-r29 .build/android/aot
          android/lineage-24/tools/install-release.py \
            --source "$RELEASE_SOURCE" \
            --aot-artifact "$AOT_SOURCE"
          rm -rf .build/baseline-inputs

      - name: Configure, build and package Android runtime
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset kernarium-ios-device-android
          cmake --build --preset kernarium-ios-device-android --parallel 2
          Kernarium/scripts/package-ios-frameworks.sh --sdk device --runtimes android
          Andarium/scripts/stage-system-image.py
          python3 scripts/check-embedded-artifacts.py \
            --android-release --kernel android --aot

      - name: Publish verified foundation as versioned repository release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FOUNDATION_SOURCE_HASH: ${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'Kernarium/**', 'dependencies/**', 'kernel/**', 'android/lineage-24/**', 'scripts/check-embedded-artifacts.py', 'Andarium/scripts/stage-system-image.py') }}
          XCODE_HASH: ${{ steps.toolchain.outputs.xcode_hash }}
        run: |
          set -euo pipefail
          for path in \
            .build/dependencies \
            .build/kernel/artifacts \
            .build/android/releases \
            .build/android/aot \
            .build/kernarium-runtime-ios-device-android-4k \
            .build/kernarium-xcframeworks \
            .build/andarium-system; do
            test -d "$path"
          done

          TAG="andarium-foundation-${XCODE_HASH}-${FOUNDATION_SOURCE_HASH}"
          mkdir -p .build/foundation-bundle
          tar -czf .build/foundation-bundle/andarium-foundation.tar.gz \
            .build/dependencies \
            .build/kernel/artifacts \
            .build/android/releases \
            .build/android/aot \
            .build/kernarium-runtime-ios-device-android-4k \
            .build/kernarium-xcframeworks \
            .build/andarium-system

          # Keep every individual release asset below 1.5 GiB.
          split -b 1500m -d -a 3 \
            .build/foundation-bundle/andarium-foundation.tar.gz \
            .build/foundation-bundle/andarium-foundation.tar.gz.part-
          cd .build/foundation-bundle
          shasum -a 256 andarium-foundation.tar.gz.part-* > SHA256SUMS
          shasum -a 256 andarium-foundation.tar.gz > archive.sha256
          printf '{\n  "schema": 1,\n  "tag": "%s",\n  "source_hash": "%s",\n  "xcode_hash": "%s",\n  "source_commit": "%s"\n}\n' \
            "$TAG" "$FOUNDATION_SOURCE_HASH" "$XCODE_HASH" "$GITHUB_SHA" > manifest.json

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" ./* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" ./* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Andarium foundation ${FOUNDATION_SOURCE_HASH:0:12}" \
              --notes "Verified reusable Andarium foundation. Source fingerprint: $FOUNDATION_SOURCE_HASH. Xcode fingerprint: $XCODE_HASH. Assets are checksum-verified and split into sub-1.5-GiB parts." \
              --target "$GITHUB_SHA"
          fi
          echo "Published foundation release: $TAG"

